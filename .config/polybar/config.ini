include-file = ~/dotfiles/.config/polybar/theme/colors.ini

[bar/main]
monitor = ${env:MONITOR}
monitor-strict = false
override-redirect = false

;
modules-left =  spotify xwindow pulseaudio
modules-center = i3
modules-right = tray network memory-mb cpu date time xbacklight  wlan battery
; modules-right = tray xbacklight  wlan battery

font-0 = "JetBrainsMonoNL Nerd Font:style=Regular:size=9;3"
font-1 = "JetBrainsMonoNL Nerd Font:style=Bold:size=9;3"
font-2 = "JetBrainsMonoNL Nerd Font:style=Italic:size=9;3"

enable-ipc = true

width =  100%
height = 32
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

border-top-size = 0
border-bottom-size = 0
border-top-color = ${colors.black}
border-bottom-color = ${colors.foreground}

; radius = 10, 10

padding = 2

module-margin-left = 1.5
module-margin-right = 1.5


line-size = 1
bottom = false

; A linha abaixo é redundante, pois as fontes já foram definidas nesta seção.
; include-file = ~/dotfiles/.config/polybar/theme/fonts.ini



;=========================================================================================
[module/i3]
;=====================
type = internal/i3
pin-workspaces = true
index-sort = true
wrapping-scroll = false
format = <label-state> <label-mode>
; workspace-label = %index%
workspace-label = %icon%
fuzzy-match = true

; ws-icon-0 = 1;
; ws-icon-1 = 2;󰈹
; ws-icon-2 = 3;󰨞
; ws-icon-3 = 4;
; ws-icon-4 = 5;󰭹
; ws-icon-5 = 6;
; ws-icon-6 = 7;
; ws-icon-7 = 8;
; ws-icon-8 = 9;
; ws-icon-9 = 10;
; ws-icon-default = 

; ws-icon-0 = 0;0
; ws-icon-1 = 1;Fire/1
; ws-icon-2 = 2;Code/2
; ws-icon-3 = 3;Work/3
; ws-icon-4 = 4;Work/4
; ws-icon-5 = 5;Work/5
; ws-icon-6 = 6;Work/6
; ws-icon-7 = 7;Disc/7
; ws-icon-8 = 8;Musc/8
; ws-icon-9 = 9;Read/9
; ws-icon-10 = 10;Back|/0

; ws-icon-0 = 0;α
; ws-icon-1 = 1;β
; ws-icon-2 = 2;γ
; ws-icon-3 = 3;δ
; ws-icon-4 = 4;ε
; ws-icon-5 = 5;ζ
; ws-icon-6 = 6;η
; ws-icon-7 = 7;θ
; ws-icon-8 = 8;ι
; ws-icon-9 = 9;κ
; ws-icon-10 = 10;λ
; ws-icon-11 = 11;μ
; ws-icon-12 = 12;ν
; ws-icon-13 = 13;ξ

ws-icon-0 = 0;0
ws-icon-1 = 1;I
ws-icon-2 = 2;II
ws-icon-3 = 3;III
ws-icon-4 = 4;IV
ws-icon-5 = 5;V
ws-icon-6 = 6;VI
ws-icon-7 = 7;VII
ws-icon-8 = 8;VIII
ws-icon-9 = 9;IX
ws-icon-10 = 10;X
ws-icon-11 = 11;Ms
ws-icon-12 = 12;Teams
ws-icon-13 = 13;Http
ws-icon-14 = 14;Front
ws-icon-15 = 15;Front II
ws-icon-16 = 16;Back
ws-icon-17 = 17;Back II
ws-icon-20 = 20;


label-format =${self.workspace-label}
label-format-padding = 1

label-mode-padding = 1
label-mode-background = ${colors.hover}

; Estilo para o workspace focado (ativo)
label-focused =${self.workspace-label}
label-focused-foreground = ${colors.background-dark}
label-focused-underline = ${colors.hover}
label-focused-background = ${colors.hover}
label-focused-padding = 2

; Estilo para workspaces não focados
label-unfocused =${self.workspace-label}
label-unfocused-padding = 2

; Estilo para workspaces visíveis em outros monitores
label-visible=${self.workspace-label}
label-visible-foreground = ${self.label-focused-foreground}
label-visible-underline = ${self.label-focused-underline}
label-visible-background = ${self.label-focused-background}
label-visible-padding = 2

; Estilo para workspaces com alerta (urgente)
label-urgent=${self.workspace-label}
label-urgent-background = ${colors.color5}
label-urgent-foreground = ${colors.color15}
label-urgent-padding = 2



;=========================================================================================
[module/tray]
type = internal/tray

format-margin = 2px
tray-padding = 2px
tray-spacing = 4px
tray-size = 12px


;=========================================================================================
[module/spotify]
;====================
type = custom/script
exec = ~/dotfiles/.config/polybar/scripts/spotify.py
interval = 1

format = <label>
; format-prefix = " "
format-prefix = ""
format-prefix-foreground = #1DB954
format-padding = 2

format-background = ${colors.background}
format-foreground = ${colors.color15}
format-underline = ${colors.color15}

label = %output:0:150%


;=========================================================================================
[module/battery]
;========================
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 98

; Estilo unificado para combinar com outros módulos
format-padding = 1
format-underline = ${colors.underline}
format-background = ${colors.background}

; Estado: Descarregando
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = " %{T2}%percentage%%%{T-}"

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-0-foreground = ${colors.color1} ; Cor de alerta para bateria crítica
ramp-capacity-foreground = ${colors.foreground}

; Estado: Carregando
format-charging = 󰂄 <animation-charging> <label-charging>
label-charging = " %{T2}%percentage%%%{T-}"

animation-charging-0 = 󰁺
animation-charging-1 = 󰁻
animation-charging-2 = 󰁼
animation-charging-3 = 󰁽
animation-charging-4 = 󰁾
animation-charging-5 = 󰁿
animation-charging-6 = 󰂀
animation-charging-7 = 󰂁
animation-charging-8 = 󰂂
animation-charging-9 = 󰁹
animation-charging-framerate = 800
animation-charging-foreground = ${colors.color4} ; Cor para indicar carregamento

; Estado: Carga Completa
format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.color4} ; Cor para indicar carga completa
label-full = %{T2}%percentage%%%{T-}


[module/powermenu]
type = custom/menu
expand-right = true
format-spacing = 1
label-open = 
# ... more configuration


;=========================================================================================
[module/xwindow]
;========================
type = internal/xwindow

; format-prefix = " "
format-prefix = ""
label = %{T2}%title%%{T-}
label-maxlen = 24

label-empty = Desktop
label-empty-foreground = #707880
format-prefix-underline = #292d3e

format-foreground =${colors.foreground}
format-underline =${colors.underline}
format-background = ${colors.background}
format-padding = 1


;=========================================================================================
[module/mpd]
type = internal/mpd
format-online = <label-song>  <icon-prev> <icon-stop> <toggle> <icon-next>

icon-prev = 󰒮
icon-stop = 󰓛
icon-play = 󰐊
icon-pause = 󰏤
icon-next = 󰒭

label-song-maxlen = 25
label-song-ellipsis = true


;=========================================================================================
[module/filesystem]
;===================
type = internal/fs
interval = 25

mount-0 = /

format-underline =${colors.underline}
format-background = ${colors.background}
format-padding = 1

label-mounted =   / %percentage_free%%


;=========================================================================================
[module/xbacklight]
type = internal/xbacklight

output= DP-4
format = <label> <bar>
label = 󰃠

bar-width = 10
bar-indicator = |
bar-indicator-foreground = #fff
bar-indicator-font = 2
bar-fill = ─
bar-fill-font = 2
bar-fill-foreground = #9f78e1
bar-empty = ─
bar-empty-font = 2
bar-empty-foreground = ${colors.foreground}


;=========================================================================================
[module/backlight-acpi]
inherit = module/xbacklight
type = internal/backlight
card = intel_backlight


;=========================================================================================
[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = "%percentage%%"
label-volume-padding = 1

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

format-muted = <label-muted>
format-muted-prefix = ""
format-muted-prefix-padding = 1
label-muted = %percentage%%
label-muted-padding = 1

click-right = pavucontrol&


;=========================================================================================
[module/crypto]
;====================
type = custom/script
interval = 300
exec = ~/dotfiles/.config/polybar/scripts/crypto/crypto.py
format-prefix-foreground = ${colors.foreground}


;=========================================================================================
[module/network]
type = internal/network
; interfaces on your machine with `ip link`
interface = enp6s0
interval = 2.0

format-connected-underline = ${colors.underline}
format-mounted-underline = ${colors.underline}

label-connected = 󱘖 %netspeed%

label-disconnected = 󰌙 not connected
label-disconnected-foreground = #66ffff

; Only applies if <ramp-signal> is used
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

; Only applies if <animation-packetloss> is used
animation-packetloss-0 = ⚠
animation-packetloss-0-foreground = #ffa64c
animation-packetloss-1 = 📶
animation-packetloss-1-foreground = #000000
; Framerate in milliseconds
animation-packetloss-framerate = 500


;=========================================================================================
[module/cpu]
type = internal/cpu
interval = 0.5

format = <label>

format-padding = 1
format-underline = ${colors.underline}

format-prefix = " "
label = %percentage%%


;=========================================================================================
[module/memory-mb]
type = custom/script
exec = free -m | awk '/^Mem:/ {printf "%.1f\n", $3/1000}'
interval = 1

format = <label>

format-padding = 1
format-underline = ${colors.underline}
format-background = ${colors.background}

format-prefix = " "
label = %output% GB


;=========================================================================================
[module/memory]
type = internal/memory
interval = 0.5

format-prefix-foreground = ${colors.color15}
format-padding = 1
format-underline = ${colors.underline}
format-background = ${colors.background}

format-prefix = " "
label = %{T2}%percentage_used%%{T-}%


;=========================================================================================
[module/temperature]
; λ find /sys -type l -printf '%p -> %l\n' | grep hwmon
type = internal/temperature
thermal-zone = 0
interval = 0.5
base-temperature = 45
warn-temperature = 70

format-prefix = " "
format = <label>
format-warn = <label-warn>

format-padding = 1
format-underline =  ${colors.underline}
format-background = ${colors.background}

format-warn-underline = ${colors.underline}
format-warn-background = ${colors.background}
format-warn-foreground = ${colors.color1}
format-warn-padding = 1

label = %temperature-c%
label-warn = %temperature-c%


;=========================================================================================
[module/weather]
;====================
type = custom/script
exec = ~/dotfiles/.config/polybar/scripts/weather.sh
interval = 1800

format-padding = 1
format-background = ${colors.background}
format-underline = ${colors.underline}

label = %output%


;=========================================================================================
[module/aur-updates]
;====================
type = custom/script
exec = ~/dotfiles/.config/polybar/scripts/updates-pacman.sh
interval = 1000

format-prefix = " "
label = %{T2}%output%%{T-}

format-underline =${colors.underline}
format-background = ${colors.background}
format-padding = 1


;=========================================================================================
[module/date]
;=====================
type = internal/date
interval = 1.0

time = "%m/%d"
time-alt = "%A, %B %d"

format-underline =  ${colors.underline}
format-background = ${colors.background}
format-padding = 1

format-prefix = "󱨰 "
label = %{T2}%time%%{T-}
format-prefix-foreground = ${colors.fg-alt}


;=========================================================================================
[module/time]
;=====================
type = internal/date
interval = 1

time = "%H:%M"
time-alt = "%H:%M:%S"

format = <label>
format-background = ${colors.bg}
format-foreground = ${colors.fg}
format-underline =${colors.underline}
format-padding = 1
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.fg-alt}
label = %{T2}%time%%{T-}


[module/xkeyboard]
type = internal/xkeyboard

; Oculta o indicador quando há apenas um layout configurado
blacklist-0 = numlock

; Formato do label
label-layout = %icon% %name%
label-layout-padding = 1
label-layout-underline = ${colors.underline}

; Ícones para diferentes layouts (opcional, mas legal)
; Você pode descobrir o nome do seu layout com o comando: setxkbmap -query | grep layout
layout-icon-0 = us;󰬴 US
layout-icon-1 = br;󰬴 BR

;=========================================================================================
[module/margin]
type = custom/text

content = %{T1} %{T-}
content-foreground = ${colors.trans}



;=========================================================================================
[module/test]
type = internal/pulseaudio
use-ui-max = false
